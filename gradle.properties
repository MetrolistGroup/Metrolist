# Keep local build daemons bounded; iOS CI overrides this for release linking.
# Kotlin, lint and Kotlin/Native all run inside the Gradle daemon, so cap parallel workers along with its heap.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.workers.max=4
# A separate Kotlin daemon would hold a second compiler heap next to Gradle's.
kotlin.compiler.execution.strategy=in-process
# iOS cinterop needs Apple SDKs; build those targets on macOS.
kotlin.native.enableKlibsCrossCompilation=false
# Stop idle daemons after 30 minutes instead of three hours.
org.gradle.daemon.idletimeout=1800000
android.useAndroidX=true
android.enableJetifier=false
org.gradle.unsafe.configuration-cache=true
android.nonTransitiveRClass=true
# Performance improvements
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configureondemand=false

# Suppress deprecated warnings
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings,android.nonFinalResIds

# Increase timeouts for JitPack downloads
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000

# Set JDK to the one bundled with Android Studio (falls back to system JDK)
#org.gradle.java.home=/opt/android-studio/jbr

# Enable Gradle task output caching
org.gradle.caching=true

# Kotlin compilation performance
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.caching.enabled=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

appVersion=14.0.0
innerTubeXVersion=v0.11.7

kotlin.native.ignoreDisabledTargets=true
# ponytail: optimized per-module caches bound link memory; revisit whole-program LTO if profiling justifies its memory cost.
kotlin.native.binary.enableReleaseBinaryCache=true

# Share the iOS playback KVO protocol between device and simulator source sets.
kotlin.mpp.enableCInteropCommonization=true
