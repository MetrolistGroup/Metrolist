[project]
name = "metrolist-slsk"
version = "0.1.0"
description = "Download a song from Soulseek in the best matching high-quality format"
requires-python = ">=3.11"
dependencies = ["aioslsk>=1.7,<2", "keyring>=25"]

[project.scripts]
metrolist-slsk = "metrolist_slsk:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["metrolist_slsk.py"]
