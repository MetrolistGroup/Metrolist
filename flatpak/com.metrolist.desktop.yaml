app-id: com.metrolist.desktop
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: com.metrolist.desktop

build-options:
  env:
    JAVA_HOME: /app/jdk
  build-args:
    - --share=network

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.secrets
  - --own-name=org.mpris.MediaPlayer2.metrolist
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-2-1
  - --filesystem=xdg-download:rw
  - --filesystem=xdg-music:rw

modules:
  - name: openjdk
    buildsystem: simple
    # jlink rejects a JDK whose native libraries were stripped after installation.
    build-options:
      no-debuginfo: true
      strip: false
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk-25.0.5.1-linux-x64-b635.102.tar.gz
        sha512: d7e61f7057d4d464a5a8f85c4c830cd7b66e54bbef6080deb0d0b17d817cc0d65b0c8b3cf7c89406ad8d2f1be83738497e1535a92c0eeb6f0d203723604b53f6
        dest: jdk
      - type: archive
        only-arches: [aarch64]
        url: https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk-25.0.5.1-linux-aarch64-b635.102.tar.gz
        sha512: b6feab16b8238e69cf003522472d677fc53382cbe768939aef7add12171cf9ae6310c1e63a980baf31474bbefb469cda034524d4d06c0e99e1b8bc448dec8afa
        dest: jdk
    build-commands:
      - mkdir -p /app/jdk
      - cp -r jdk/* /app/jdk/

  - name: metrolist
    buildsystem: simple
    build-options:
      env:
        PATH: /app/jdk/bin:/usr/bin:/bin
        JAVA_HOME: /app/jdk
    sources:
      # Committed tree and submodules only; ignored local leftovers stay out of the build.
      - type: git
        path: ..
        branch: main
      - type: file
        path: com.metrolist.desktop.desktop
      - type: file
        path: com.metrolist.desktop.metainfo.xml
      - type: file
        path: com.metrolist.desktop.png
      - type: file
        path: com.metrolist.desktop.svg
    build-commands:
      - ./gradlew clean :desktopApp:verifyReleaseDistributableJars --no-daemon --no-build-cache --no-configuration-cache
      - mkdir -p /app
      - cp -r desktopApp/build/compose/binaries/main-release/app/Metrolist/* /app/
      - |
        cat > /app/bin/com.metrolist.desktop <<'LAUNCHER'
        #!/bin/sh
        export SKIKO_WAYLAND="${SKIKO_WAYLAND:-1}"
        if [ -z "${GDK_BACKEND:-}" ]; then
            if [ -n "${DISPLAY:-}" ] && [ "${METROLIST_USE_WAKEFIELD:-0}" != "1" ]; then
                export GDK_BACKEND=x11
            elif [ -n "${WAYLAND_DISPLAY:-}" ]; then
                export GDK_BACKEND=wayland
            fi
        fi
        export _JAVA_AWT_WM_NONREPARENTING="${_JAVA_AWT_WM_NONREPARENTING:-1}"
        export MALLOC_ARENA_MAX="${MALLOC_ARENA_MAX:-4}"
        export WEBKIT_DISABLE_DMABUF_RENDERER=1
        export WEBKIT_DISABLE_COMPOSITING_MODE=1
        export LC_NUMERIC=C
        DIR="$(cd "$(dirname "$(readlink -f "$0")")" && pwd)"
        exec "$DIR/Metrolist" "$@"
        LAUNCHER
      - chmod +x /app/bin/com.metrolist.desktop
      - mkdir -p /app/share/metainfo
      - |
        APP_VERSION="$(grep '^appVersion=' gradle.properties | cut -d= -f2)"
        BUILD_DATE="$(date +%Y-%m-%d)"
        sed -e "s/@VERSION@/$APP_VERSION/" -e "s/@DATE@/$BUILD_DATE/" \
          com.metrolist.desktop.metainfo.xml > /app/share/metainfo/com.metrolist.desktop.metainfo.xml
      - install -Dm644 com.metrolist.desktop.desktop /app/share/applications/com.metrolist.desktop.desktop
      - install -Dm644 com.metrolist.desktop.png /app/share/icons/hicolor/512x512/apps/com.metrolist.desktop.png
      - install -Dm644 com.metrolist.desktop.svg /app/share/icons/hicolor/scalable/apps/com.metrolist.desktop.svg
    cleanup:
      - /jdk
