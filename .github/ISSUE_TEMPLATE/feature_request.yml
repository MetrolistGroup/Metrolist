name: Feature request
description: Suggest an improvement for 7xTune
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape 7xTune! Please search existing issues first so related ideas can be discussed together.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      description: A few quick checks help keep feature discussions focused.
      options:
        - label: I checked for an existing issue or discussion about this idea.
          required: true
        - label: This request describes one feature or improvement.
          required: true
        - label: The title clearly describes the idea.
          required: true

  - type: textarea
    id: feature-description
    attributes:
      label: Feature description
      description: Describe what you would like 7xTune to do and, if useful, where it should appear in the app.
      placeholder: What would you like to add or improve?
    validations:
      required: true

  - type: textarea
    id: why-is-the-feature-requested
    attributes:
      label: Why would this be useful?
      description: Explain the problem, limitation, or use case this feature would address.
      placeholder: What would this improve for you?
    validations:
      required: true

  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      description: Add examples, mockups, screenshots, or other context if available.
      placeholder: Any extra details that might help us understand the idea.
