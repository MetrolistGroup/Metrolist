name: Bug report
description: Report a problem with 7xTune
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve 7xTune! Before submitting, please check for an existing report and include enough detail for us to reproduce the issue. Duplicate reports may be closed and linked to the original discussion.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      description: Please confirm each item before opening your report.
      options:
        - label: I can reproduce the issue on the latest available [7xTune build](https://github.com/RahulExe69/7xTune/actions/workflows/build.yml).
          required: true
        - label: I checked for existing open and closed issues about the same problem.
          required: true
        - label: This report describes one bug.
          required: true
        - label: The title clearly describes the problem.
          required: true
        - label: I have written the report in English so maintainers can review it.
          required: true

  - type: markdown
    attributes:
      value: |
        ---
        ## Bug details

  - type: textarea
    id: reproduce-steps
    attributes:
      label: Steps to reproduce
      description: What did you do before the problem appeared?
      placeholder: |
        1. Open 7xTune
        2. Go to '...'
        3. Tap '...'
        4. Observe the problem
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behaviour
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behaviour
      placeholder: What happened instead?
    validations:
      required: true

  - type: textarea
    id: sreen-media
    attributes:
      label: Screenshots or screen recordings
      description: Images or a short recording can help us understand the issue. You can upload them directly here.

  - type: markdown
    attributes:
      value: |
        ## Logs (especially for crashes)

        Logs can help maintainers diagnose problems that are difficult to reproduce. If possible, attach a Logcat recording.

        ### One way to capture logs
        1. Install [LogFox](https://github.com/F0x1d/LogFox/releases) and [Shizuku](https://github.com/thedjchi/Shizuku/releases) from their official release pages.
        2. Follow Shizuku's setup instructions for your device.
        3. Open LogFox and start a recording.
        4. Reproduce the problem in 7xTune.
        5. Stop and export the recording, then attach it to your report.
        6. Stop the recording and Shizuku when finished if you do not need them for anything else.

        For an immediate crash, enable LogFox's notification permissions if requested and check whether it captures a crash report.

        > **Privacy reminder:** Review logs before uploading them. Remove account identifiers, tokens, personal information, or other sensitive data. Do not post passwords or session secrets.

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Attach relevant logs if available. If you cannot capture logs, explain that here.
      placeholder: Paste redacted logs or describe how you captured and attached them.

  - type: input
    id: app-version
    attributes:
      label: 7xTune version
      description: You can find the app version in 7xTune's Settings/About section.
      placeholder: "Example: 1.0.10"
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android version
      description: You can find this in Android Settings > About phone.
      placeholder: "Example: Android 14"
    validations:
      required: true

  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      placeholder: Add any other context that might help us investigate.
