name: Report a bug
description: Report a problem with Metrolist
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Writing this with an LLM? Check [rejected features](https://github.com/MetrolistGroup/Metrolist/blob/main/AGENTS.md#rejected-features) and existing issues first, apply [unslop](https://github.com/MetrolistGroup/Metrolist/blob/main/skills/unslop/SKILL.md) to the text and keep it short.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Issues that skip these checks or duplicate an existing issue are closed without a response.
      options:
        - label: I can reproduce this on the [latest release](https://github.com/MetrolistGroup/Metrolist/releases).
          required: true
        - label: I searched open and closed issues and found no duplicate.
          required: true
        - label: This issue contains only one bug.
          required: true
        - label: The title describes the bug.
          required: true
        - label: This issue is written in English.
          required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      multiple: true
      options:
        - Android
        - Android Auto
        - Android TV
        - iOS
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Issue
      description: Describe the issue. You can drag and drop files, screenshots, or videos here.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Add the logs here in case of anomalies or crashes.
      render: shell
    validations:
      required: false
