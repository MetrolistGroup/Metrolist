name: Build APK

on:
  workflow_call:
    inputs:
      run-verification:
        description: Run tests and launch checks, disabled only after the release gate succeeds
        required: false
        default: true
        type: boolean
      assemble:
        description: Assemble the APK, disabled for push checks covered by Nightly
        required: false
        default: true
        type: boolean
      variant:
        description: Android build variant
        required: false
        default: debug
        type: string
      upload-artifact:
        description: Upload the APK as a workflow artifact
        required: false
        default: false
        type: boolean
      artifact-name:
        description: Workflow artifact name
        required: false
        default: android-build
        type: string
      staging-release-tag:
        description: Draft release tag used for cross-job package handoff
        required: false
        default: ''
        type: string
      cache-read-only:
        description: Keep the Gradle cache read-only
        required: false
        default: false
        type: boolean
      require-signing:
        description: Fail unless the release APK is signed
        required: false
        default: false
        type: boolean
      upload-sentry:
        description: Require Sentry credentials and upload release mappings
        required: false
        default: false
        type: boolean
      app-version:
        description: Override gradle.properties appVersion, such as a nightly build with commit metadata
        required: false
        default: ''
        type: string
    secrets:
      GRADLE_ENCRYPTION_KEY:
        required: false
      KEYSTORE_PATH:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false
      LASTFM_API_KEY:
        required: false
      LASTFM_SECRET:
        required: false
      LYPRIO_BASE_URL:
        required: false
      LYPRIO_HMAC_KEY:
        required: false

jobs:
  build:
    name: APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Validate Compose resources and APK collection
        if: inputs.run-verification
        run: |
          python3 scripts/check_compose_resource_escapes.py
          python3 -m unittest discover -s scripts -p 'test_collect_android_apks.py'

      - name: Validate build configuration
        id: config
        shell: bash
        env:
          APP_VERSION_OVERRIDE: ${{ inputs.app-version }}
          BUILD_VARIANT: ${{ inputs.variant }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          UPLOAD_SENTRY: ${{ inputs.upload-sentry }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LYPRI