name: Musify APK Builder

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Choose which APKs to build"
        required: true
        type: choice
        options:
          - debug
          - release
          - both
        default: both
      version_name:
        description: "Version name to embed in the APK"
        required: true
        type: string
        default: "1.0.10"

permissions:
  contents: read

concurrency:
  group: musify-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Musify APKs
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      METROLIST_APPLICATION_ID: exe.musify.app
      METROLIST_APP_NAME: Musify
      METROLIST_BUILD_COMMIT: ${{ github.sha }}
      MUSIFY_VERSION_NAME: ${{ inputs.version_name }}
      MUSIFY_VERSION_NAME: ${{ inputs.version_name }}
      PULL_REQUEST: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Prepare debug keystore
        if: inputs.build_type == 'debug' || inputs.build_type == 'both'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Validate version input
        shell: bash
        run: |
          if [[ ! "$MUSIFY_VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use MAJOR.MINOR.PATCH format, such as 1.0.10."
            exit 1
          fi

      - name: Build selected APKs
        shell: bash
        run: |
          set -euo pipefail
          echo "BUILD_TYPE=${{ inputs.build_type }}" >> "$GITHUB_ENV"
          case "${{ inputs.build_type }}" in
            debug) ./gradlew --no-daemon --console=plain assembleGmsDebug --warning-mode summary ;;
            release) ./gradlew --no-daemon --console=plain assembleGmsRelease --warning-mode summary ;;
            both) ./gradlew --no-daemon --console=plain assembleGmsDebug assembleGmsRelease --warning-mode summary ;;
            *) echo "::error::Unknown build type"; exit 1 ;;
          esac

      - name: Sign release APK
        if: env.BUILD_TYPE == 'release' || env.BUILD_TYPE == 'both'
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/gms/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 36.0.0

      - name: Prepare APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          if [ "$BUILD_TYPE" = "debug" ] || [ "$BUILD_TYPE" = "both" ]; then
            DEBUG_APK="$(find app/build/outputs/apk/gms/debug -maxdepth 1 -type f -name '*.apk' ! -name '*-androidTest*.apk' | head -n 1)"
            test -n "$DEBUG_APK"
            cp "$DEBUG_APK" artifacts/Musify-v${MUSIFY_VERSION_NAME}-debug.apk
          fi

          if [ "$BUILD_TYPE" = "release" ] || [ "$BUILD_TYPE" = "both" ]; then
            RELEASE_APK="$(find app/build/outputs/apk/gms/release -type f -name '*-signed.apk' | head -n 1)"
            if [ -z "$RELEASE_APK" ]; then
              echo "::error::Signed release APK not found. Check the release signing secrets."
              find app/build/outputs/apk/gms/release -maxdepth 2 -type f -name '*.apk' -print
              exit 1
            fi
            cp "$RELEASE_APK" artifacts/Musify-v${MUSIFY_VERSION_NAME}-release.apk
          fi

          sha256sum artifacts/*.apk | tee artifacts/SHA256SUMS.txt
          ls -lh artifacts/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Musify-v${{ inputs.version_name }}-APKs
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
