name: Reporter labels
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
jobs:
  label:
    if: >-
      !github.event.issue.pull_request &&
      github.event.comment.user.type == 'User' &&
      github.event.issue.user.id == github.event.comment.user.id &&
      (startsWith(github.event.comment.body, '/label ') || startsWith(github.event.comment.body, '/unlabel '))
    runs-on: blacksmith-2vcpu-ubuntu-2604
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await require('./.github/scripts/reporter-labels.cjs')({ github, context });
