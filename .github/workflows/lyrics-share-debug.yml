name: Lyrics Share Debug

on:
  push:
    branches: ['billie/lyrics-share-test']

permissions:
  contents: read

concurrency:
  group: lyrics-share-debug
  cancel-in-progress: true

jobs:
  debug:
    if: github.ref == 'refs/heads/billie/lyrics-share-test'
    runs-on: blacksmith-8vcpu-ubuntu-2604
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/prepare-ci-gradle
        with:
          cache-scope: lyrics-share-debug
          cache-read-only: 'true'
          persist-configuration-cache: 'false'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
      - name: Assemble debug APK
        shell: bash
        run: |
          ./gradlew :androidApp:assembleDebug --no-daemon --no-configuration-cache \
            --max-workers=4 '-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'
      - name: Verify and collect APK
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/collect_android_apks.py androidApp/build/outputs/apk/debug dist 14.0.1 debug
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -x "$signer"
          for apk in dist/*.apk; do
            unzip -tq "$apk"
            "$signer" verify --verbose "$apk"
            "${signer%/*}/aapt" dump badging "$apk" > "$apk.badging.txt"
            grep -F "package: name='com.metrolist.music.debug'" "$apk.badging.txt"
          done
          (cd dist && sha256sum ./*.apk > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: metrolist-lyrics-share-debug
          path: |
            dist/*.apk
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 4
