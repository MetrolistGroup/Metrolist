name: PR AI disclosure

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: write

concurrency:
  group: pr-ai-disclosure-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  disclosure:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (pull.state !== 'open') return;
            const text = (pull.body || '')
              .replace(/<!--[\s\S]*?(?:-->|$)/g, '')
              .replace(/```[\s\S]*?(?:```|$)|~~~[\s\S]*?(?:~~~|$)/g, '')
              .trimEnd();
            const footer = text.match(/(?:^|\n)Written by an agent \(([^(),\r\n]+),\s*([^()\r\n]+)\)\.?\s*$/i);
            const agent = footer?.[1].trim();
            const model = footer?.[2].trim();
            const placeholder = /^(?:<[^>]+>|\[[^\]]+\]|TODO|TBD|unknown|agent|model|\.{3})$/i;
            const disclosed = Boolean(
              footer &&
              agent &&
              model &&
              !placeholder.test(agent) &&
              !placeholder.test(model));

            const marker = '<!-- metrolist-ai-disclosure -->';
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
            if (disclosed && !existing) return;
            const body = `${marker}\n\n` + (disclosed
              ? 'An agent disclosure footer is present in the PR body. Reviewers should confirm it names the agent and model that authored the changes.'
              : 'If an agent wrote or modified this PR, end the PR body with `Written by an agent (<agent>, <model>)`. No disclosure is needed when no agent authored the contribution.');
            if (!existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            } else if (existing.body !== body) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            }
