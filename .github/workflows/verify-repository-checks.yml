name: Verify Flatpak

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    name: Validate Flatpak manifest
    runs-on: blacksmith-2vcpu-ubuntu-2604
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Flatpak builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder
      - name: Validate manifest and packaging targets
        run: |
          flatpak-builder --show-manifest flatpak/com.metrolist.desktop.yaml > /dev/null
          make --dry-run flatpak-deps flatpak-build flatpak-install flatpak-bundle
