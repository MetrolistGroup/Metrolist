name: Verify repository checks

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: repository-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select checks
    runs-on: blacksmith-2vcpu-ubuntu-2604
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      platform: ${{ steps.paths.outputs.repository }}
      shared-only: ${{ steps.paths.outputs.shared-only }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select platform checks
        id: paths
        uses: ./.github/actions/ci-changes

  checks:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.platform == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2604
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      flatpak: ${{ steps.changed-paths.outputs.flatpak }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect Flatpak input changes
        id: changed-paths
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.sha }}
        run: node .github/scripts/flatpak-paths.cjs
      - name: Check scripts and hooks
        run: |
          node --test .github/scripts/*.test.cjs
          bash -n scripts/build_ios.sh
          python3 scripts/check_compose_resource_escapes.py
          python3 scripts/test_compose_resource_escapes.py
          python3 scripts/check_translation_mechanics.py
          python3 scripts/test_translation_mechanics.py
          python3 scripts/test_hooks.py
          python3 scripts/test_build_ios.py
          python3 scripts/test_metromem.py
          python3 -m unittest discover -s .github/tests
          python3 -m unittest discover -s scripts/desktop-native-image -p test_native_pipeline.py
          python3 scripts/test_build_appimage.py
          python3 scripts/test_distribution.py
          python3 scripts/test_generate_altstore_source.py
          python3 .github/actions/upload-desktop-sentry/test_verify_metadata.py

  flatpak:
    name: Validate Flatpak manifest
    needs: checks
    if: always() && needs.checks.result != 'skipped' && needs.checks.outputs.flatpak != 'false'
    runs-on: blacksmith-2vcpu-ubuntu-2604
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Flatpak builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder
      - name: Validate manifest and packaging targets
        run: |
          flatpak-builder --show-manifest flatpak/com.metrolist.desktop.yaml > /dev/null
          make --dry-run flatpak-deps flatpak-build flatpak-install flatpak-bundle
